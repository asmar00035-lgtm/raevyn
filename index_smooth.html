<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no" />
  <title>Raevyn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #aladin-lite-div {
      width: 100vw;
      height: 100vh;
    }
    .aladin-location,
    .aladin-fov,
    .aladin-reticleControl,
    .aladin-logo,
    .aladin-toolbar,
    .aladin-projControls { display: none !important; }
  </style>
</head>
<body>
  <div id="aladin-lite-div"></div>

  <script type="text/javascript"
    src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"
    charset="utf-8">
  </script>

  <script type="text/javascript">
    let aladin;
    let targetFov;
    let animating = false;

    A.init.then(() => {
      aladin = A.aladin('#aladin-lite-div', {
        survey:         'P/DSS2/color',
        fov:            120,
        target:         '0 0',
        cooFrame:       'equatorial',
        showReticle:              false,
        showZoomControl:          false,
        showFullscreenControl:    false,
        showLayersControl:        false,
        showGotoControl:          false,
        showSimbadPointerControl: false,
        showShareControl:         false,
        showCooGrid:              false,
        showFrame:                false,
        showCooLocation:          false,
        showProjectionControl:    false,
        showContextMenu:          false,
        showStatusBar:            false,
      });

      targetFov = aladin.getFov()[0];

      // intercept scroll and make zoom smooth
      const div = document.getElementById('aladin-lite-div');

      div.addEventListener('wheel', function(e) {
        e.stopImmediatePropagation();
        e.preventDefault();

        const delta = e.deltaY > 0 ? 1.08 : 0.92; // small step per scroll tick
        targetFov = Math.min(180, Math.max(0.01, targetFov * delta));

        if (!animating) {
          animating = true;
          smoothZoom();
        }
      }, { capture: true, passive: false });

      function smoothZoom() {
        const currentFov = aladin.getFov()[0];
        const diff = targetFov - currentFov;

        if (Math.abs(diff) < 0.01) {
          aladin.setFov(targetFov);
          animating = false;
          return;
        }

        // ease towards target
        aladin.setFov(currentFov + diff * 0.12);
        requestAnimationFrame(smoothZoom);
      }
    });
  </script>
</body>
</html>
