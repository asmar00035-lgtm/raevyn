<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no"/>
  <title>Raevyn</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;overflow:hidden}
    #aladin-lite-div{width:100vw;height:100vh}
    .aladin-location,.aladin-fov,.aladin-reticleControl,
    .aladin-logo,.aladin-toolbar,.aladin-projControls{display:none!important}
    #overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10}
    .con-label{
      position:absolute;color:rgba(100,200,210,0.78);font-family:'Arial',sans-serif;
      font-size:12px;letter-spacing:2.5px;text-transform:uppercase;white-space:nowrap;
      transform:translate(-50%,-50%);text-shadow:0 0 10px rgba(80,180,200,0.7);
      transition:opacity 0.4s,color 0.2s;pointer-events:all;cursor:pointer;user-select:none;
    }
    .con-label:hover{color:rgba(160,230,240,1);text-shadow:0 0 14px rgba(80,200,220,1)}
    .star-label{
      position:absolute;color:rgba(190,215,255,0.9);font-family:'Georgia',serif;
      font-size:12px;font-style:italic;pointer-events:none;white-space:nowrap;
      text-shadow:0 0 8px rgba(120,160,255,0.8),0 0 2px #000;transition:opacity 0.4s;
    }
    .cardinal{
      position:absolute;color:rgba(220,120,80,0.9);font-family:'Arial',sans-serif;
      font-size:20px;font-weight:bold;pointer-events:none;
      text-shadow:0 0 12px rgba(220,100,60,0.7);transform:translate(-50%,-50%);transition:opacity 0.4s;
    }
    #line-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9}

    /* Info Panel */
    #info-panel{
      position:fixed;bottom:0;left:0;width:310px;
      background:rgba(8,14,32,0.9);backdrop-filter:blur(20px);
      border-top:1px solid rgba(100,200,210,0.2);border-right:1px solid rgba(100,200,210,0.12);
      z-index:200;transform:translateY(105%);
      transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);pointer-events:all;
    }
    #info-panel.visible{transform:translateY(0)}
    .ip-top{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid rgba(100,200,210,0.1)}
    .ip-icon{font-size:28px;line-height:1;flex-shrink:0}
    .ip-name{font-family:'Georgia',serif;font-size:19px;font-style:italic;color:rgba(210,235,255,0.95)}
    .ip-abbr{font-family:'Arial',sans-serif;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(100,200,210,0.55);margin-top:2px}
    .ip-close{margin-left:auto;background:none;border:none;color:rgba(130,190,210,0.5);font-size:18px;cursor:pointer;padding:4px;transition:color 0.2s}
    .ip-close:hover{color:rgba(200,235,245,0.9)}
    .ip-body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:9px}
    .ip-row{display:flex;justify-content:space-between;align-items:baseline}
    .ip-key{font-family:'Arial',sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(100,200,210,0.45)}
    .ip-val{font-family:'Georgia',serif;font-size:13px;font-style:italic;color:rgba(200,225,245,0.88)}
    .ip-desc{font-family:'Arial',sans-serif;font-size:11.5px;line-height:1.65;color:rgba(160,205,225,0.65);padding-top:9px;border-top:1px solid rgba(100,200,210,0.08)}
    .ip-btn{
      margin-top:4px;width:100%;padding:9px;
      background:rgba(100,200,210,0.08);border:1px solid rgba(100,200,210,0.22);border-radius:6px;
      color:rgba(140,215,230,0.88);font-family:'Arial',sans-serif;font-size:11px;letter-spacing:2px;
      text-transform:uppercase;cursor:pointer;transition:background 0.2s,border-color 0.2s;
    }
    .ip-btn:hover{background:rgba(100,200,210,0.18);border-color:rgba(100,200,210,0.5)}

    /* ── Bottom Toolbar ── */
    #toolbar{
      position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
      display:flex;gap:6px;align-items:center;
      background:rgba(8,14,32,0.82);backdrop-filter:blur(16px);
      border:1px solid rgba(100,200,210,0.15);border-radius:40px;
      padding:7px 14px;z-index:300;pointer-events:all;
    }
    .tb-btn{
      display:flex;flex-direction:column;align-items:center;gap:3px;
      background:none;border:none;cursor:pointer;
      padding:6px 10px;border-radius:24px;
      transition:background 0.18s;
      color:rgba(120,180,200,0.5);
      user-select:none;
    }
    .tb-btn:hover{background:rgba(100,200,210,0.1)}
    .tb-btn.on{color:rgba(100,220,235,0.95)}
    .tb-btn svg{display:block;transition:opacity 0.2s}
    .tb-label{
      font-family:'Arial',sans-serif;font-size:9px;letter-spacing:1px;
      text-transform:uppercase;white-space:nowrap;
    }
    .tb-sep{width:1px;height:28px;background:rgba(100,200,210,0.12);margin:0 2px}
  </style>
</head>
<body>
<div id="aladin-lite-div"></div>
<canvas id="line-canvas"></canvas>
<div id="overlay"></div>

<div id="info-panel">
  <div class="ip-top">
    <div class="ip-icon" id="ip-icon"></div>
    <div><div class="ip-name" id="ip-name"></div><div class="ip-abbr" id="ip-abbr"></div></div>
    <button class="ip-close" id="ip-close">✕</button>
  </div>
  <div class="ip-body">
    <div class="ip-row"><span class="ip-key">Brightest Star</span><span class="ip-val" id="ip-bright"></span></div>
    <div class="ip-row"><span class="ip-key">Main Stars</span><span class="ip-val" id="ip-stars"></span></div>
    <div class="ip-row"><span class="ip-key">Best Visible</span><span class="ip-val" id="ip-best"></span></div>
    <div class="ip-desc" id="ip-desc"></div>
    <button class="ip-btn" id="ip-goto">⟶ &nbsp; Center View</button>
  </div>
</div>

<!-- Bottom Toolbar -->
<div id="toolbar">
  <!-- Constellation Lines -->
  <button class="tb-btn on" id="tb-lines" title="Constellation Lines">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="4" cy="20" r="1.5"/><circle cx="12" cy="4" r="1.5"/><circle cx="20" cy="14" r="1.5"/>
      <line x1="4" y1="20" x2="12" y2="4"/><line x1="12" y1="4" x2="20" y2="14"/>
    </svg>
    <span class="tb-label">Lines</span>
  </button>
  <!-- Constellation Names -->
  <button class="tb-btn on" id="tb-names" title="Constellation Names">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="5" cy="8" r="1.5"/><circle cx="19" cy="6" r="1.5"/><circle cx="12" cy="17" r="1.5"/>
      <line x1="5" y1="8" x2="19" y2="6"/><line x1="19" y1="6" x2="12" y2="17"/>
      <line x1="8" y1="12" x2="8" y2="20"/><line x1="11" y1="20" x2="5" y2="20"/>
    </svg>
    <span class="tb-label">Names</span>
  </button>
  <div class="tb-sep"></div>
  <!-- Star Names -->
  <button class="tb-btn on" id="tb-stars" title="Star Names">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
    </svg>
    <span class="tb-label">Stars</span>
  </button>
  <div class="tb-sep"></div>
  <!-- Cardinals -->
  <button class="tb-btn on" id="tb-cardinal" title="Cardinal Directions">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>
      <polyline points="9,5 12,2 15,5"/><polyline points="9,19 12,22 15,19"/>
    </svg>
    <span class="tb-label">Compass</span>
  </button>
</div>

const CARDINALS=[{label:"N",ra:0,dec:90},{label:"S",ra:0,dec:-90},{label:"E",ra:90,dec:0},{label:"W",ra:270,dec:0}];

let aladin,targetFov,animating=false,selectedCon=null;
// Toggle states
const show={lines:true,names:true,stars:true,cardinal:true};

// Wire toolbar buttons
['lines','names','stars','cardinal'].forEach(key=>{
  const btn=document.getElementById('tb-'+key);
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    show[key]=!show[key];
    btn.classList.toggle('on',show[key]);
  });
});
const overlay=document.getElementById('overlay');
const canvas=document.getElementById('line-canvas');
const ctx=canvas.getContext('2d');
let starEls=[],conEls=[],cardEls=[];

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

// Info panel
const infoPanel=document.getElementById('info-panel');
function showInfo(c){
  selectedCon=c.name;
  document.getElementById('ip-icon').textContent=c.icon;
  document.getElementById('ip-name').textContent=c.name;
  document.getElementById('ip-abbr').textContent=c.name.toUpperCase();
  document.getElementById('ip-bright').textContent=c.bright;
  document.getElementById('ip-stars').textContent=c.n;
  document.getElementById('ip-best').textContent=c.best;
  document.getElementById('ip-desc').textContent=c.desc;
  infoPanel.classList.add('visible');
}
function hideInfo(){infoPanel.classList.remove('visible');selectedCon=null;}
document.getElementById('ip-close').addEventListener('click',hideInfo);
document.getElementById('ip-goto').addEventListener('click',()=>{
  if(!aladin||!selectedCon)return;
  const c=CONSTELLATIONS.find(x=>x.name===selectedCon);
  if(c)aladin.animateToRaDec(c.ra,c.dec,25);
});

A.init.then(()=>{
  aladin=A.aladin('#aladin-lite-div',{
    survey:'P/DSS2/color',fov:120,target:'0 0',cooFrame:'equatorial',
    showReticle:false,showZoomControl:false,showFullscreenControl:false,
    showLayersControl:false,showGotoControl:false,showSimbadPointerControl:false,
    showShareControl:false,showCooGrid:false,showFrame:false,
    showCooLocation:false,showProjectionControl:false,showContextMenu:false,showStatusBar:false,
  });
  targetFov=aladin.getFov()[0];

  STARS.forEach(s=>{
    const el=document.createElement('div');el.className='star-label';el.textContent=s[0];el.style.opacity='0';
    overlay.appendChild(el);starEls.push(el);
  });
  CONSTELLATIONS.forEach((c,i)=>{
    const el=document.createElement('div');el.className='con-label';el.textContent=c.name.toUpperCase();el.style.opacity='0';
    el.addEventListener('click',e=>{e.stopPropagation();showInfo(c);});
    overlay.appendChild(el);conEls.push(el);
  });
  CARDINALS.forEach(c=>{
    const el=document.createElement('div');el.className='cardinal';el.textContent=c.label;el.style.opacity='0';
    overlay.appendChild(el);cardEls.push(el);
  });

  document.getElementById('aladin-lite-div').addEventListener('click',hideInfo);

  document.getElementById('aladin-lite-div').addEventListener('wheel',e=>{
    e.stopImmediatePropagation();e.preventDefault();
    targetFov=Math.min(180,Math.max(0.01,targetFov*(e.deltaY>0?1.08:0.92)));
    if(!animating){animating=true;smoothZoom();}
  },{capture:true,passive:false});

  function smoothZoom(){
    const cur=aladin.getFov()[0],diff=targetFov-cur;
    if(Math.abs(diff)<0.01){aladin.setFov(targetFov);animating=false;update();return;}
    aladin.setFov(cur+diff*0.12);update();requestAnimationFrame(smoothZoom);
  }

  function update(){
    const fov=aladin.getFov()[0],W=window.innerWidth,H=window.innerHeight;
    ctx.clearRect(0,0,W,H);

    // ── Lines ──
    const lineOp=show.lines&&fov<130?Math.min(0.55,(130-fov)/60):0;
    if(lineOp>0){
      CONSTELLATIONS.forEach(c=>{
        const segs=CON_LINES[c.name];if(!segs)return;
        const sel=selectedCon===c.name;
        ctx.strokeStyle=sel?`rgba(160,230,240,${Math.min(1,lineOp*2.2)})`:`rgba(80,180,200,${lineOp})`;
        ctx.lineWidth=sel?1.6:0.85;
        segs.forEach(seg=>{
          const p1=aladin.world2pix(seg[0],seg[1]),p2=aladin.world2pix(seg[2],seg[3]);
          if(!p1||!p2||Math.hypot(p2[0]-p1[0],p2[1]-p1[1])>W*1.5)return;
          ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.stroke();
        });
      });
    }

    // ── Constellation names ──
    const conOp=show.names&&fov<130?Math.min(0.82,(130-fov)/50):0;
    CONSTELLATIONS.forEach((c,i)=>{
      const el=conEls[i];
      if(conOp===0){el.style.opacity='0';el.style.pointerEvents='none';return;}
      const pos=aladin.world2pix(c.ra,c.dec);
      if(!pos||pos[0]<-80||pos[0]>W+80||pos[1]<-80||pos[1]>H+80){el.style.opacity='0';el.style.pointerEvents='none';return;}
      el.style.left=pos[0]+'px';el.style.top=pos[1]+'px';
      el.style.opacity=selectedCon===c.name?'1':String(conOp);
      el.style.color=selectedCon===c.name?'rgba(160,230,240,1)':'';
      el.style.pointerEvents='all';
    });

    // ── Star names ──
    const starOp=show.stars&&fov<70?Math.min(1,(70-fov)/25):0;
    STARS.forEach((s,i)=>{
      const el=starEls[i];if(starOp===0){el.style.opacity='0';return;}
      const pos=aladin.world2pix(s[1],s[2]);
      if(!pos||pos[0]<-60||pos[0]>W+60||pos[1]<-60||pos[1]>H+60){el.style.opacity='0';return;}
      el.style.left=(pos[0]+9)+'px';el.style.top=(pos[1]-5)+'px';
      el.style.opacity=starOp;el.style.fontSize=(s[3]<0?14:s[3]<1?13:12)+'px';
    });

    // ── Cardinals ──
    CARDINALS.forEach((c,i)=>{
      const el=cardEls[i];
      if(!show.cardinal){el.style.opacity='0';return;}
      const pos=aladin.world2pix(c.ra,c.dec);
      if(!pos||pos[0]<-40||pos[0]>W+40||pos[1]<-40||pos[1]>H+40){el.style.opacity='0';return;}
      el.style.left=pos[0]+'px';el.style.top=pos[1]+'px';el.style.opacity='0.85';
    });
  }
  aladin.on('positionChanged',update);aladin.on('zoomChanged',update);setInterval(update,150);
});
</script>
