*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#c{display:block;width:100vw;height:100vh;cursor:grab;position:absolute;top:0;left:0}
#c.drag{cursor:grabbing}
#aladin-wrap{position:absolute;top:0;left:0;width:100vw;height:100vh;display:none}
#aladin-lite-div{width:100%;height:100%}
.aladin-location,.aladin-fov,.aladin-reticleControl,.aladin-logo,.aladin-toolbar,.aladin-projControls{display:none!important}
#labels{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10}
.lbl-con{position:absolute;transform:translate(-50%,-50%);color:rgba(100,210,220,0.82);font-family:'Arial',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;text-shadow:0 0 8px rgba(60,180,200,0.7);white-space:nowrap;pointer-events:all;cursor:pointer;user-select:none;transition:color 0.2s;}
.lbl-con:hover{color:rgba(160,240,255,1)}
.lbl-star{position:absolute;color:rgba(190,215,255,0.88);font-family:'Georgia',serif;font-size:11px;font-style:italic;white-space:nowrap;pointer-events:none;text-shadow:0 0 6px rgba(100,140,255,0.8),0 0 2px #000;}
.lbl-cardinal{position:absolute;transform:translate(-50%,-50%);color:rgba(230,130,80,0.92);font-family:'Arial',sans-serif;font-size:18px;font-weight:700;pointer-events:none;text-shadow:0 0 12px rgba(220,100,60,0.8);}
#info{position:fixed;bottom:0;left:0;width:305px;background:rgba(6,10,24,0.92);backdrop-filter:blur(20px);border-top:1px solid rgba(100,200,210,0.2);border-right:1px solid rgba(100,200,210,0.1);z-index:200;transform:translateY(105%);transition:transform 0.3s cubic-bezier(.4,0,.2,1);pointer-events:all;}
#info.show{transform:translateY(0)}
.i-top{display:flex;align-items:center;gap:11px;padding:15px 17px 11px;border-bottom:1px solid rgba(100,200,210,0.1)}
.i-icon{font-size:26px;flex-shrink:0}
.i-name{font-family:'Georgia',serif;font-size:18px;font-style:italic;color:rgba(210,235,255,.95)}
.i-sub{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(100,200,210,.5);margin-top:2px;font-family:'Arial',sans-serif}
.i-x{margin-left:auto;background:none;border:none;color:rgba(130,190,210,.5);font-size:17px;cursor:pointer;padding:4px;transition:color .2s}
.i-x:hover{color:rgba(200,235,245,.9)}
.i-body{padding:13px 17px 15px;display:flex;flex-direction:column;gap:8px}
.i-row{display:flex;justify-content:space-between;align-items:baseline}
.i-k{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(100,200,210,.45);font-family:'Arial',sans-serif}
.i-v{font-size:13px;font-style:italic;color:rgba(200,225,245,.88);font-family:'Georgia',serif}
.i-desc{font-size:11.5px;line-height:1.65;color:rgba(155,205,225,.65);padding-top:9px;border-top:1px solid rgba(100,200,210,.08);font-family:'Arial',sans-serif}
.i-go{margin-top:4px;width:100%;padding:9px;background:rgba(100,200,210,.08);border:1px solid rgba(100,200,210,.22);border-radius:6px;color:rgba(140,215,230,.88);font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .2s;font-family:'Arial',sans-serif}
.i-go:hover{background:rgba(100,200,210,.18)}
#tb{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:2px;align-items:center;background:rgba(6,10,22,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:5px 6px;z-index:300;pointer-events:all;}
.tb-b{display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;width:36px;height:36px;border-radius:7px;transition:background .15s,color .15s;color:rgba(255,255,255,.28);user-select:none;}
.tb-b:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.65)}
.tb-b.on{color:rgba(110,225,240,1);background:rgba(100,200,210,.14)}
.tb-sep{width:1px;height:20px;background:rgba(255,255,255,.07);margin:0 2px}

/* Mode switch button */
#mode-btn{
  position:fixed;top:18px;right:18px;z-index:300;
  display:flex;align-items:center;gap:8px;
  background:rgba(6,10,22,.85);backdrop-filter:blur(20px);
  border:1px solid rgba(100,200,210,.2);border-radius:9px;

  transition:border-color .2s,background .2s;

}
#mode-btn:hover{border-color:rgba(100,200,210,.5);background:rgba(6,10,30,.9)}
#mode-btn svg{flex-shrink:0}
#mode-label{white-space:nowrap}

function rd2v(ra,dec){
  const d=Math.PI/180,r=ra*d,dc=dec*d;
  return new THREE.Vector3(-Math.cos(dc)*Math.cos(r),Math.sin(dc),Math.cos(dc)*Math.sin(r));
}
function proj3(v,cam,W,H){
  const c=v.clone().project(cam);
  if(c.z>0.9999)return null;
  return{x:(c.x+1)/2*W,y:(-c.y+1)/2*H};
}

      },
      undefined,
      ()=>tryLoad(i+1)
    );
  }
  function buildProcedural(){
    // High-res procedural fallback
    const W=8192,H=4096;
    const tc=document.createElement('canvas');tc.width=W;tc.height=H;
    const tx=tc.getContext('2d');
    tx.fillStyle='#000008';tx.fillRect(0,0,W,H);
    function bY(x){
      const ra=(x/W)*360;
      return H/2+Math.sin((ra-33)*Math.PI/180)*0.595*(H/2)+Math.sin((ra*2-8)*Math.PI/180)*0.085*(H/2);
    }
    [[600,0.06,'200,215,255'],[300,0.13,'160,180,240'],[140,0.25,'120,145,220'],[60,0.40,'100,125,210'],[25,0.58,'150,165,235']].forEach(([hw,a,col])=>{
      for(let x=0;x<W;x+=2){
        const cy=bY(x),g=tx.createLinearGradient(x,cy-hw,x,cy+hw);
        g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(0.5,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);
        tx.fillStyle=g;tx.fillRect(x,cy-hw,2,hw*2);
      }
    });
    const gcX=(266.4/360)*W,gcY=bY(gcX);
    [[450,'255,235,170',0.55],[200,'255,220,140',0.70],[80,'255,245,200',0.85]].forEach(([r,c,a])=>{
      const g=tx.createRadialGradient(gcX,gcY,0,gcX,gcY,r);
      g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,'rgba(0,0,0,0)');
      tx.fillStyle=g;tx.beginPath();tx.arc(gcX,gcY,r,0,Math.PI*2);tx.fill();
    });
    for(let i=0;i<5000;i++){
      const x=Math.random()*W,cy=bY(x),dy=(Math.random()-0.5)*500;
      const d=Math.exp(-dy*dy/(2*130*130));
      if(Math.random()>d*0.9+0.1)continue;
      const sz=Math.random()*2+0.4,b=0.3+d*0.7,t=Math.random();
      tx.fillStyle=t<0.55?`rgba(210,220,255,${b})`:t<0.78?`rgba(255,240,200,${b})`:`rgba(255,185,120,${b*0.7})`;
      tx.beginPath();tx.arc(x,cy+dy,sz,0,Math.PI*2);tx.fill();
    }
    const tex=new THREE.CanvasTexture(tc);
    const geo=new THREE.SphereGeometry(493,64,32);
    const mat=new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,transparent:true,opacity:0.90,depthWrite:false});
    const mw=new THREE.Mesh(geo,mat);
    scene.add(mw);window._mwMesh=mw;window._mwMat=mat;
  }
  tryLoad(0);
})();

let lineObj;
(function(){
  const pts=[],R=490;
  CONSTELLATIONS.forEach(c=>c.lines.forEach(seg=>{
    const v1=rd2v(seg[0],seg[1]).multiplyScalar(R),v2=rd2v(seg[2],seg[3]).multiplyScalar(R);
    pts.push(v1.x,v1.y,v1.z,v2.x,v2.y,v2.z);
  }));
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
  const lineMat=new THREE.LineBasicMaterial({color:0x55c0d0,transparent:true,opacity:0});
  lineObj=new THREE.LineSegments(g,lineMat);
  // Segment-by-segment draw animation
  const totalSegs=pts.length/6; // each segment = 6 floats
  let drawnSegs=0;
  const drawInterval=setInterval(()=>{
    drawnSegs=Math.min(totalSegs,drawnSegs+Math.ceil(totalSegs/120));
    // Show only drawn segments by updating draw range
    lineObj.geometry.setDrawRange(0,drawnSegs*2);
    if(drawnSegs>=totalSegs){
      clearInterval(drawInterval);
      // Then fade to final opacity
      let op=0;const fadeT=setInterval(()=>{
        op=Math.min(0.50,op+0.015);lineMat.opacity=op;
        if(op>=0.50)clearInterval(fadeT);
      },16);
    }
  },18);
  lineObj.geometry.setDrawRange(0,0);
  scene.add(lineObj);
})();

// Constellation fill shapes
let fillObjs=[];
(function(){
  const R=488;
  CONSTELLATIONS.forEach(c=>{
    // Build polygon from lines (collect unique points)
    const pts=[];
    c.lines.forEach(seg=>{
      [0,2].forEach(off=>{
        const ra=seg[off],dec=seg[off+1];
        const key=ra.toFixed(2)+','+dec.toFixed(2);
        if(!pts.find(p=>p.k===key))pts.push({k:key,v:rd2v(ra,dec).multiplyScalar(R)});
      });
    });
    if(pts.length<3)return;
    // Simple fan triangulation from centroid
    const center=new THREE.Vector3();
    pts.forEach(p=>center.add(p.v));center.divideScalar(pts.length);
    // Sort by angle around center projected on tangent plane
    const normal=center.clone().normalize();
    const up=new THREE.Vector3(0,1,0);
    const tang=new THREE.Vector3().crossVectors(normal,up).normalize();
    const bitan=new THREE.Vector3().crossVectors(normal,tang).normalize();
    pts.sort((a,b)=>{
      const da=a.v.clone().sub(center),db=b.v.clone().sub(center);
      const angA=Math.atan2(da.dot(bitan),da.dot(tang));
      const angB=Math.atan2(db.dot(bitan),db.dot(tang));
      return angA-angB;
    });
    const verts=[];
    for(let i=0;i<pts.length;i++){
      const next=(i+1)%pts.length;
      verts.push(center.x,center.y,center.z);
      verts.push(pts[i].v.x,pts[i].v.y,pts[i].v.z);
      verts.push(pts[next].v.x,pts[next].v.y,pts[next].v.z);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
    const mat=new THREE.MeshBasicMaterial({color:0x40b8c8,transparent:true,opacity:0.0,side:THREE.DoubleSide,depthWrite:false});
    const mesh=new THREE.Mesh(g,mat);
    scene.add(mesh);
    fillObjs.push({mesh,mat,name:c.name});
  });
})();

// Camera control
let rotX=0,rotY=0,tRotX=0,tRotY=0,fov3=70,tFov3=70;
let drag=false,lx=0,ly=0,clickMoved=false;
function camLook(){
  // no vertical clamp — full 360
  rotX+=(tRotX-rotX)*0.1; rotY+=(tRotY-rotY)*0.1;
  fov3+=(tFov3-fov3)*0.1;
  camera.fov=fov3; camera.updateProjectionMatrix();
  // no clamp
  camera.lookAt(new THREE.Vector3(Math.cos(rotX)*Math.sin(rotY),Math.sin(rotX),Math.cos(rotX)*Math.cos(rotY)));
  // Milky way: brighter + more detailed when zoomed in
  if(window._mwMat){
    const t=Math.max(0,Math.min(1,(75-fov3)/65));
    window._mwMat.opacity=0.55+t*0.45;
  }
  // Highlight hovered constellation fill
  fillObjs.forEach(f=>{
    const target=selCon===f.name?0.08:0.0;
    f.mat.opacity+=(target-f.mat.opacity)*0.12;
  });
}

  },{capture:true,passive:false});
  function smoothAladinZoom(){

    if(Math.abs(diff)<0.05){aladin.setFov(aladinFovTarget);aladinAnimating=false;return;}

// ── MODE SWITCH ───────────────────────────────────────────────────────────────
function syncToAladin(){
  if(!aladinReady||!aladin)return;
  // Convert Three.js look direction to RA/Dec
  const lookRa=((-rotY)*(180/Math.PI)+360)%360;
  const lookDec=rotX*(180/Math.PI);
  aladin.gotoRaDec(lookRa,lookDec);
  aladin.setFov(fov3);
  aladinFovTarget=fov3;
}
function syncToThreeJS(){
  if(!aladinReady||!aladin)return;
  // Get Aladin center
  const pos=aladin.getRaDec();
  const ra=pos[0],dec=pos[1];
  tRotY=-ra*(Math.PI/180); tRotX=dec*(Math.PI/180);
  rotY=tRotY; rotX=tRotX;
  const f=aladin.getFov()[0];
  tFov3=Math.max(10,Math.min(100,f)); fov3=tFov3;
}

const labDiv=document.getElementById('labels');
const show={lines:true,names:true,stars:true,cardinal:true};
let selCon=null;

function updateLabels3D(){
  const W=innerWidth,H=innerHeight,R=490;
  CONSTELLATIONS.forEach((c,i)=>{
    const el=cLbls[i];
    if(!show.names){el.style.opacity='0';el.style.pointerEvents='none';return;}
    const p=proj3(rd2v(c.ra,c.dec).multiplyScalar(R),camera,W,H);
    if(!p){el.style.opacity='0';el.style.pointerEvents='none';return;}
    el.style.left=p.x+'px';el.style.top=p.y+'px';
    el.style.opacity=selCon===c.name?'1':'0.82';
    el.style.color=selCon===c.name?'rgba(160,240,255,1)':'';
    el.style.pointerEvents='all';
  });
  STARS.forEach((s,i)=>{
    const el=sLbls[i];
    if(!show.stars){el.style.opacity='0';return;}
    const p=proj3(rd2v(s[1],s[2]).multiplyScalar(R),camera,W,H);
    if(!p){el.style.opacity='0';return;}
    el.style.left=(p.x+8)+'px';el.style.top=(p.y-5)+'px';
    el.style.fontSize=(s[3]<0?14:s[3]<1?13:11)+'px';el.style.opacity='0.88';
  });
  CARDINALS.forEach((c,i)=>{
    const el=dLbls[i];el.textContent=c.label;
    if(!show.cardinal){el.style.opacity='0';return;}
    const p=proj3(rd2v(c.ra,c.dec).multiplyScalar(R),camera,W,H);
    if(!p){el.style.opacity='0';return;}
    el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.opacity='0.9';
  });

function updateLabelsAladin(){
  if(!aladinReady||!aladin)return;
  const W=innerWidth,H=innerHeight;
  lctx.clearRect(0,0,W,H);

  // Lines
  if(show.lines){
    lctx.strokeStyle='rgba(85,192,208,0.5)';lctx.lineWidth=0.7;
    CONSTELLATIONS.forEach(c=>{
      c.lines.forEach(seg=>{
        const p1=aladin.world2pix(seg[0],seg[1]),p2=aladin.world2pix(seg[2],seg[3]);
        if(!p1||!p2||Math.hypot(p2[0]-p1[0],p2[1]-p1[1])>W*1.5)return;
        lctx.beginPath();lctx.moveTo(p1[0],p1[1]);lctx.lineTo(p2[0],p2[1]);lctx.stroke();
      });
    });
  }
  CONSTELLATIONS.forEach((c,i)=>{
    const el=cLbls[i];
    if(!show.names){el.style.opacity='0';el.style.pointerEvents='none';return;}
    const pos=aladin.world2pix(c.ra,c.dec);
    if(!pos||pos[0]<-80||pos[0]>W+80||pos[1]<-80||pos[1]>H+80){el.style.opacity='0';el.style.pointerEvents='none';return;}
    el.style.left=pos[0]+'px';el.style.top=pos[1]+'px';
    el.style.opacity=selCon===c.name?'1':'0.82';
    el.style.color=selCon===c.name?'rgba(160,240,255,1)':'';
    el.style.pointerEvents='all';
  });
  STARS.forEach((s,i)=>{
    const el=sLbls[i];
    if(!show.stars){el.style.opacity='0';return;}
    const pos=aladin.world2pix(s[1],s[2]);
    if(!pos||pos[0]<-60||pos[0]>W+60||pos[1]<-60||pos[1]>H+60){el.style.opacity='0';return;}
    el.style.left=(pos[0]+9)+'px';el.style.top=(pos[1]-5)+'px';
    el.style.fontSize=(s[3]<0?14:s[3]<1?13:11)+'px';el.style.opacity='0.88';
  });
  CARDINALS.forEach((c,i)=>{
    const el=dLbls[i];el.textContent=c.label;
    if(!show.cardinal){el.style.opacity='0';return;}
    const pos=aladin.world2pix(c.ra,c.dec);
    if(!pos||pos[0]<-40||pos[0]>W+40||pos[1]<-40||pos[1]>H+40){el.style.opacity='0';return;}
    el.style.left=pos[0]+'px';el.style.top=pos[1]+'px';el.style.opacity='0.9';
  });
}
