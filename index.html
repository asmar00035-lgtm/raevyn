// 2. Milky Way band — canvas-generated, no CORS issues
(function(){
  const W=2048,H=1024;
  const tc=document.createElement('canvas');tc.width=W;tc.height=H;
  const cx=tc.getContext('2d');
  cx.fillStyle='#06080f';cx.fillRect(0,0,W,H);
  // Main galactic band — tilted ellipse across center
  const band=cx.createLinearGradient(0,H*0.25,0,H*0.75);
  band.addColorStop(0,'rgba(0,0,0,0)');
  band.addColorStop(0.3,'rgba(30,40,80,0.18)');
  band.addColorStop(0.45,'rgba(60,70,130,0.32)');
  band.addColorStop(0.5,'rgba(80,90,160,0.38)');
  band.addColorStop(0.55,'rgba(60,70,130,0.32)');
  band.addColorStop(0.7,'rgba(30,40,80,0.18)');
  band.addColorStop(1,'rgba(0,0,0,0)');
  cx.save();cx.translate(W/2,H/2);cx.rotate(-0.45);cx.translate(-W/2,-H/2);
  cx.fillStyle=band;cx.fillRect(0,0,W,H);
  cx.restore();
  // Core glow — galactic center bright spot
  const core=cx.createRadialGradient(W*0.58,H*0.52,0,W*0.58,H*0.52,W*0.22);
  core.addColorStop(0,'rgba(120,100,180,0.45)');
  core.addColorStop(0.3,'rgba(80,60,140,0.25)');
  core.addColorStop(0.7,'rgba(40,30,80,0.10)');
  core.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=core;cx.fillRect(0,0,W,H);
  // Second glow — anti-center
  const core2=cx.createRadialGradient(W*0.08,H*0.48,0,W*0.08,H*0.48,W*0.12);
  core2.addColorStop(0,'rgba(60,80,140,0.20)');
  core2.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=core2;cx.fillRect(0,0,W,H);
  // Dust lanes — dark streaks inside band
  cx.save();cx.globalCompositeOperation='multiply';
  cx.translate(W/2,H/2);cx.rotate(-0.45);cx.translate(-W/2,-H/2);
  const dust=cx.createLinearGradient(0,H*0.43,0,H*0.57);
  dust.addColorStop(0,'rgba(0,0,0,0)');
  dust.addColorStop(0.4,'rgba(0,0,5,0.55)');
  dust.addColorStop(0.5,'rgba(0,0,8,0.65)');
  dust.addColorStop(0.6,'rgba(0,0,5,0.55)');
  dust.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=dust;cx.fillRect(0,0,W,H);
  cx.restore();
  const tex=new THREE.CanvasTexture(tc);
  tex.minFilter=THREE.LinearFilter;
  tex.magFilter=THREE.LinearFilter;
  const geo=new THREE.SphereGeometry(489,64,32);
  const mat=new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,transparent:true,opacity:1.0,depthWrite:false});
  scene.add(new THREE.Mesh(geo,mat));
  window._mwMat=mat;
})();

// 3. Round star sprite texture (radial gradient)
const starSprite=(function(){
  const s=64,tc=document.createElement('canvas');tc.width=s;tc.height=s;
  const tx=tc.getContext('2d');
  // Clear to transparent
  tx.clearRect(0,0,s,s);
  // Draw soft glowing circle
  const g=tx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.2,'rgba(220,235,255,0.9)');
  g.addColorStop(0.5,'rgba(180,210,255,0.5)');
  g.addColorStop(0.8,'rgba(140,180,255,0.15)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  tx.fillStyle=g;
  tx.fillRect(0,0,s,s);
  const tex=new THREE.CanvasTexture(tc);
  tex.premultiplyAlpha=false;
  return tex;
})();

// 4. Background stars — 12000, round sprites, 60% #c8d4ff, 25% #fff5e0, 15% #ffb870
let bgStarsMesh, bloomStarsMesh;
(function(){
  const N=12000,R=490,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  const c1={r:200/255,g:215/255,b:1},c2={r:1,g:245/255,b:210/255},c3={r:1,g:170/255,b:90/255};
  for(let i=0;i<N;i++){
    const u=Math.random()*2*Math.PI,v=Math.acos(2*Math.random()-1);
    pos[i*3]=R*Math.sin(v)*Math.cos(u);pos[i*3+1]=R*Math.sin(v)*Math.sin(u);pos[i*3+2]=R*Math.cos(v);
    const t=Math.random();
    if(t<0.6){col[i*3]=c1.r;col[i*3+1]=c1.g;col[i*3+2]=c1.b;}
    else if(t<0.85){col[i*3]=c2.r;col[i*3+1]=c2.g;col[i*3+2]=c2.b;}
    else{col[i*3]=c3.r;col[i*3+1]=c3.g;col[i*3+2]=c3.b;}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:1.5,map:starSprite,transparent:true,opacity:0.9,vertexColors:true,sizeAttenuation:false,alphaTest:0.05,blending:THREE.AdditiveBlending,depthWrite:false});
  bgStarsMesh=new THREE.Points(g,mat);scene.add(bgStarsMesh);
})();

    for(let i=0;i<cfg.N;i++){
      const u=Math.random()*2*Math.PI,v=Math.acos(2*Math.random()-1);
      pos[i*3]=R*Math.sin(v)*Math.cos(u);pos[i*3+1]=R*Math.sin(v)*Math.sin(u);pos[i*3+2]=R*Math.cos(v);
      const t=Math.random();
      if(t<0.6){col[i*3]=c1.r;col[i*3+1]=c1.g;col[i*3+2]=c1.b;}
      else if(t<0.85){col[i*3]=c2.r;col[i*3+1]=c2.g;col[i*3+2]=c2.b;}
      else{col[i*3]=c3.r;col[i*3+1]=c3.g;col[i*3+2]=c3.b;}
    }
    const g=new THREE.BufferGeometry();

    lodLayers.push({mat,threshold:cfg.threshold,targetOpacity:cfg.opacity});
  });
})();

// 5. Bright named stars — spectral colors + magnitude-based size + multi-layer bloom
(function(){
  const R=490;
  const allPos=[],allCol=[];
  const bloomPos=[],bloomCol=[],bloomSizes=[];
  const bloom2Pos=[],bloom2Col=[];

  STARS.forEach(s=>{
    const v=rd2v(s[1],s[2]).multiplyScalar(R);
    allPos.push(v.x,v.y,v.z);
    const [cr,cg,cb]=spectralColor(s[4]);
    allCol.push(cr/255,cg/255,cb/255);
    bloomPos.push(v.x,v.y,v.z);
    bloomCol.push(cr/255,cg/255,cb/255);
    bloom2Pos.push(v.x,v.y,v.z);
    bloom2Col.push(cr/255,cg/255,cb/255);
  });

  // Core stars — size by magnitude
  const coreGeo=new THREE.BufferGeometry();
  coreGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(allPos),3));
  coreGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(allCol),3));
  // Per-star sizes via custom shader isn't available in basic PointsMaterial easily,
  // so we split into magnitude groups
  const groups=[
    {stars:[],size:6.5}, // mag < 0
    {stars:[],size:5.0}, // mag 0–1
    {stars:[],size:3.8}, // mag 1–2
    {stars:[],size:2.8}, // mag 2+
  ];
  STARS.forEach((s,i)=>{
    const g=s[3]<0?0:s[3]<1?1:s[3]<2?2:3;
    groups[g].stars.push(i);
  });
const brightStarMeshes=[];
  groups.forEach(grp=>{
    if(!grp.stars.length)return;
    const pos=[],col=[];
    grp.stars.forEach(i=>{
      pos.push(allPos[i*3],allPos[i*3+1],allPos[i*3+2]);
      col.push(allCol[i*3],allCol[i*3+1],allCol[i*3+2]);
    });
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
    g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));
    const mat=new THREE.PointsMaterial({size:grp.size,map:starSprite,transparent:true,opacity:1.0,vertexColors:true,sizeAttenuation:false,alphaTest:0.04,blending:THREE.AdditiveBlending,depthWrite:false});
    const mesh=new THREE.Points(g,mat);scene.add(mesh);brightStarMeshes.push(mesh);
  });

  // Bloom layer 1 — mid halo
  const b1g=new THREE.BufferGeometry();
  b1g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(bloomPos),3));
  b1g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(bloomCol),3));
  const b1mat=new THREE.PointsMaterial({size:18,map:starSprite,transparent:true,opacity:0.22,vertexColors:true,sizeAttenuation:false,alphaTest:0.01,blending:THREE.AdditiveBlending,depthWrite:false});
  bloomStarsMesh=new THREE.Points(b1g,b1mat);scene.add(bloomStarsMesh);

  // Bloom layer 2 — wide soft glow
  const b2g=new THREE.BufferGeometry();
  b2g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(bloom2Pos),3));
  b2g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(bloom2Col),3));
  const b2mat=new THREE.PointsMaterial({size:40,map:starSprite,transparent:true,opacity:0.09,vertexColors:true,sizeAttenuation:false,alphaTest:0.01,blending:THREE.AdditiveBlending,depthWrite:false});
  scene.add(new THREE.Points(b2g,b2mat));
})();

// 6. Constellation lines — rgba(68,180,200,0.55), width 0.8
let lineObj,lineTotalSegments;
(function(){
  const pts=[],R=490;
  CONSTELLATIONS.forEach(c=>c.lines.forEach(seg=>{const v1=rd2v(seg[0],seg[1]).multiplyScalar(R),v2=rd2v(seg[2],seg[3]).multiplyScalar(R);pts.push(v1.x,v1.y,v1.z,v2.x,v2.y,v2.z);}));
  lineTotalSegments=pts.length/6;
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
  const lineMat=new THREE.LineBasicMaterial({color:0x44b4c8,transparent:true,opacity:0.55,linewidth:1});
  lineObj=new THREE.LineSegments(g,lineMat);lineObj.geometry.setDrawRange(0,lineTotalSegments*2);scene.add(lineObj);
})();

// 7. Constellation fill — rgba(40,140,160,0.06), highlight 0.12
let fillObjs=[];
(function(){
  const R=488;
  CONSTELLATIONS.forEach(c=>{
    const pts=[];c.lines.forEach(seg=>{[0,2].forEach(off=>{const ra=seg[off],dec=seg[off+1];const key=ra.toFixed(2)+','+dec.toFixed(2);if(!pts.find(p=>p.k===key))pts.push({k:key,v:rd2v(ra,dec).multiplyScalar(R)});});});
    if(pts.length<3)return;
    const center=new THREE.Vector3();pts.forEach(p=>center.add(p.v));center.divideScalar(pts.length);
    const normal=center.clone().normalize(),up=new THREE.Vector3(0,1,0),tang=new THREE.Vector3().crossVectors(normal,up).normalize(),bitan=new THREE.Vector3().crossVectors(normal,tang).normalize();
    pts.sort((a,b)=>{const da=a.v.clone().sub(center),db=b.v.clone().sub(center);return Math.atan2(da.dot(bitan),da.dot(tang))-Math.atan2(db.dot(bitan),db.dot(tang));});
    const verts=[];for(let i=0;i<pts.length;i++){const next=(i+1)%pts.length;verts.push(center.x,center.y,center.z,pts[i].v.x,pts[i].v.y,pts[i].v.z,pts[next].v.x,pts[next].v.y,pts[next].v.z);}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
    const mat=new THREE.MeshBasicMaterial({color:0x288ca0,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false});
    const mesh=new THREE.Mesh(g,mat);scene.add(mesh);fillObjs.push({mesh,mat,name:c.name});
  });
})();

// Equatorial coordinate grid — RA lines (hours) + Dec lines (degrees)
(function(){
  const R=491, pts=[], color=new THREE.Color(0x1a4060);
  for(let h=0;h<24;h++){
    const ra=h*15;
    for(let d=-88;d<=88;d+=2){
      pts.push(...rd2v(ra,d).multiplyScalar(R).toArray());
      pts.push(...rd2v(ra,d+2).multiplyScalar(R).toArray());
    }
  }
  for(let dec=-80;dec<=80;dec+=10){
    for(let h=0;h<360;h+=3){
      pts.push(...rd2v(h,dec).multiplyScalar(R).toArray());
      pts.push(...rd2v(h+3,dec).multiplyScalar(R).toArray());
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
  const mat=new THREE.LineBasicMaterial({color:0x1a4a6a,transparent:true,opacity:0.18,depthWrite:false});
  const grid=new THREE.LineSegments(geo,mat);
  scene.add(grid);
  window._gridObj=grid;
})();

// 8. Camera — Stellarium-style sphere-based drag (no gimbal artifact near poles)
function screenToSphere(x,y){
  const nx=(x/window.innerWidth)*2-1;
  const ny=-(y/window.innerHeight)*2+1;
  const vec=new THREE.Vector3(nx,ny,0.5).unproject(camera).sub(camera.position).normalize();
  return vec;
}

let fov3=70,tFov3=70;
let isDragging=false,clickMoved=false;
let startSpherePos=null,startYaw=0,startPitch=0;
let yaw=Math.PI,pitch=0,tYaw=Math.PI,tPitch=0;
let velX=0,velY=0;

function applyCamera(){
  const dir=new THREE.Vector3(Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch),Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(dir);
}

cvs.addEventListener('mousedown',e=>{
  isDragging=true;clickMoved=false;
  startSpherePos=screenToSphere(e.clientX,e.clientY);
  startYaw=tYaw;startPitch=tPitch;
  cvs.classList.add('drag');
});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  const currentVec=screenToSphere(e.clientX,e.clientY);
  const dYaw=Math.atan2(currentVec.x,currentVec.z)-Math.atan2(startSpherePos.x,startSpherePos.z);
  const dPitch=Math.asin(Math.max(-1,Math.min(1,currentVec.y)))-Math.asin(Math.max(-1,Math.min(1,startSpherePos.y)));
  tYaw=startYaw-dYaw;
  tPitch=startPitch+dPitch;
  tPitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,tPitch));
  if(Math.abs(dYaw)+Math.abs(dPitch)>0.002)clickMoved=true;
  velX=-dYaw*0.15;velY=dPitch*0.15;
});
window.addEventListener('mouseup',()=>{isDragging=false;cvs.classList.remove('drag');});
cvs.addEventListener('touchstart',e=>{
  if(e.touches.length===1){isDragging=true;clickMoved=false;startSpherePos=screenToSphere(e.touches[0].clientX,e.touches[0].clientY);startYaw=tYaw;startPitch=tPitch;}
},{passive:true});
window.addEventListener('touchmove',e=>{
  if(!isDragging||e.touches.length!==1)return;
  const currentVec=screenToSphere(e.touches[0].clientX,e.touches[0].clientY);
  const dYaw=Math.atan2(currentVec.x,currentVec.z)-Math.atan2(startSpherePos.x,startSpherePos.z);
  const dPitch=Math.asin(Math.max(-1,Math.min(1,currentVec.y)))-Math.asin(Math.max(-1,Math.min(1,startSpherePos.y)));
  tYaw=startYaw-dYaw;
  tPitch=startPitch+dPitch;
  tPitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,tPitch));
  if(Math.abs(dYaw)+Math.abs(dPitch)>0.002)clickMoved=true;
  velX=-dYaw*0.15;velY=dPitch*0.15;
},{passive:true});
window.addEventListener('touchend',e=>{
  isDragging=false;
  // If finger barely moved, treat as click → hide info
  if(!clickMoved)hideInfo();
});
window.addEventListener('wheel',e=>{
  if(mode!=='3d')return;
  tFov3=Math.min(185,Math.max(0.5,tFov3*(e.deltaY>0?1.06:0.94)));
},{passive:true});

function camLook(){
  if(!isDragging){tYaw+=velX;tPitch+=velY;tPitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,tPitch));velX*=0.88;velY*=0.88;}
  yaw+=(tYaw-yaw)*0.12;
  pitch+=(tPitch-pitch)*0.12;
  fov3+=(tFov3-fov3)*0.10;
  camera.fov=fov3;
  camera.updateProjectionMatrix();
  applyCamera();
  lineCanvas.style.display = (fov3 > 120 || !show.lines) ? 'none' : 'block';
}

function getViewRaDec(){
  const ra=((-yaw+Math.PI)*180/Math.PI+360)%360;
  const dec=pitch*180/Math.PI;
  return[ra,dec];
}

function lookAtRaDec(ra,dec){
  tYaw=-(ra*Math.PI/180-Math.PI);
  tPitch=dec*Math.PI/180;
}

  const s=document.createElement('script');s.charset='utf-8';
  s.src='https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js';
  s.onload=()=>{aladinScriptLoaded=true;cb();};

  if(aladinReady)return;

  const W=innerWidth,H=innerHeight,R=490;
  CONSTELLATIONS.forEach((c,i)=>{const el=cLbls[i];if(!show.names){el.style.opacity='0';el.style.pointerEvents='none';return;}const p=proj3(rd2v(c.ra,c.dec).multiplyScalar(R),camera,W,H);if(!p){el.style.opacity='0';el.style.pointerEvents='none';return;}el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.opacity=selCon===c.name?'1':'0.82';el.style.color=selCon===c.name?'rgba(160,240,255,1)':'';el.style.pointerEvents='all';});
  STARS.forEach((s,i)=>{const el=sLbls[i];if(!show.stars){el.style.opacity='0';return;}const p=proj3(rd2v(s[1],s[2]).multiplyScalar(R),camera,W,H);if(!p){el.style.opacity='0';return;}el.style.left=(p.x+8)+'px';el.style.top=(p.y-5)+'px';el.style.fontSize=(s[3]<0?14:s[3]<1?13:11)+'px';el.style.opacity='0.88';});
  CARDINALS.forEach((c,i)=>{const el=dLbls[i];el.textContent=c.label;if(!show.cardinal){el.style.opacity='0';return;}const p=proj3(rd2v(c.ra,c.dec).multiplyScalar(R),camera,W,H);if(!p){el.style.opacity='0';return;}el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.opacity='0.9';});
  if(lineObj)lineObj.visible=show.lines;
  if(show.lines){
  const LW=lineCanvas.width,LH=lineCanvas.height;
  lctx.clearRect(0,0,LW,LH);
  CONSTELLATIONS.forEach(c=>{
    c.lines.forEach(seg=>{
      const p1=proj3(rd2v(seg[0],seg[1]).multiplyScalar(490),camera,LW,LH);
      const p2=proj3(rd2v(seg[2],seg[3]).multiplyScalar(490),camera,LW,LH);
      if(!p1||!p2)return;
      const dx=p1.x-p2.x,dy=p1.y-p2.y;
      if(dx*dx+dy*dy>(LW*0.5)*(LW*0.5))return;
      lctx.beginPath();
      lctx.moveTo(p1.x,p1.y);
      lctx.lineTo(p2.x,p2.y);
      lctx.strokeStyle='rgba(68,180,200,0.55)';
      lctx.lineWidth=0.8;
      lctx.stroke();
    });
  });
  }
}

function updateLabelsAladin(){
  if(!aladinReady||!aladin)return;const W=innerWidth,H=innerHeight;lctx.clearRect(0,0,W,H);
  if(show.lines){lctx.strokeStyle='rgba(68,180,200,0.55)';lctx.lineWidth=0.8;CONSTELLATIONS.forEach(c=>c.lines.forEach(seg=>{const p1=aladin.world2pix(seg[0],seg[1]),p2=aladin.world2pix(seg[2],seg[3]);if(!p1||!p2||Math.hypot(p2[0]-p1[0],p2[1]-p1[1])>W*1.5)return;lctx.beginPath();lctx.moveTo(p1[0],p1[1]);lctx.lineTo(p2[0],p2[1]);lctx.stroke();}));}
  CONSTELLATIONS.forEach((c,i)=>{const el=cLbls[i];if(!show.names){el.style.opacity='0';el.style.pointerEvents='none';return;}const pos=aladin.world2pix(c.ra,c.dec);if(!pos||pos[0]<-80||pos[0]>W+80||pos[1]<-80||pos[1]>H+80){el.style.opacity='0';el.style.pointerEvents='none';return;}el.style.left=pos[0]+'px';el.style.top=pos[1]+'px';el.style.opacity=selCon===c.name?'1':'0.82';el.style.pointerEvents='all';});
  STARS.forEach((s,i)=>{const el=sLbls[i];if(!show.stars){el.style.opacity='0';return;}const pos=aladin.world2pix(s[1],s[2]);if(!pos||pos[0]<-60||pos[0]>W+60||pos[1]<-60||pos[1]>H+60){el.style.opacity='0';return;}el.style.left=(pos[0]+9)+'px';el.style.top=(pos[1]-5)+'px';el.style.fontSize=(s[3]<0?14:s[3]<1?13:11)+'px';el.style.opacity='0.88';});
  CARDINALS.forEach((c,i)=>{const el=dLbls[i];el.textContent=c.label;if(!show.cardinal){el.style.opacity='0';return;}const pos=aladin.world2pix(c.ra,c.dec);if(!pos||pos[0]<-40||pos[0]>W+40||pos[1]<-40||pos[1]>H+40){el.style.opacity='0';return;}el.style.left=pos[0]+'px';el.style.top=pos[1]+'px';el.style.opacity='0.9';});
}

// Info panel
const infoEl=document.getElementById('info');
function showInfo(c){fillObjs.forEach(f=>{f.mat.opacity=f.name===c.name?0.08:0;});selCon=c.name;document.getElementById('i-icon').textContent=c.icon;document.getElementById('i-name').textContent=c.name;document.getElementById('i-sub').textContent=c.name.toUpperCase();document.getElementById('i-bright').textContent=c.bright;document.getElementById('i-stars').textContent=c.n;document.getElementById('i-best').textContent=c.best;document.getElementById('i-desc').textContent=c.desc;infoEl.classList.add('show');}
function hideInfo(){infoEl.classList.remove('show');selCon=null;fillObjs.forEach(f=>{f.mat.opacity=0;});}
document.getElementById('i-x').addEventListener('click',hideInfo);
cvs.addEventListener('click',()=>{if(!clickMoved)hideInfo();});
document.getElementById('i-go').addEventListener('click',()=>{if(!selCon)return;const c=CONSTELLATIONS.find(x=>x.name===selCon);if(!c)return;if(mode==='3d'){tFov3=45;lookAtRaDec(c.ra,c.dec);}else if(aladinReady&&aladin){aladin.gotoRaDec(c.ra,c.dec);aladin.setFov(45);aladinFovTarget=45;}});

['lines','names','stars','cardinal','grid'].forEach(k=>{
  document.getElementById('tb-'+k).addEventListener('click',e=>{e.stopPropagation();show[k]=!show[k];document.getElementById('tb-'+k).classList.toggle('on',show[k]);
    if(k==='grid'&&window._gridObj){window._gridObj.visible=show[k];}
    if(k==='lines'&&show.lines&&lineObj){lineObj.visible=true;lineObj.geometry.setDrawRange(0,0);lineObj.material.opacity=0.55;const total=lineTotalSegments*2;const dur=300;const step=Math.max(2,Math.ceil(total/(dur/16))&~1);let drawn=0;const iv=setInterval(()=>{drawn=Math.min(total,drawn+step);lineObj.geometry.setDrawRange(0,drawn);if(drawn>=total)clearInterval(iv);},16);}
    if(k==='lines'&&!show.lines&&lineObj){lineObj.visible=false;}
  });
});


(function loop(){
  requestAnimationFrame(loop);
  try{
    if(mode==='3d'){
      camLook();
      updateLabels3D();
      renderer.render(scene,camera);
      document.getElementById('fov-display').textContent='FOV '+Math.round(fov3)+'°';
      lodLayers.forEach(L=>{
        const target=fov3<L.threshold?L.targetOpacity:0;
        L.mat.opacity+=(target-L.mat.opacity)*0.06;
      });
    }else{
      updateLabelsAladin();
      document.getElementById('fov-display').textContent='FOV '+Math.round(aladin?aladin.getFov()[0]:60)+'°';
    }
  }catch(e){}
})();


window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  if(lineCanvas){lineCanvas.width=window.innerWidth;lineCanvas.height=window.innerHeight;}
});
</script>
</body>
