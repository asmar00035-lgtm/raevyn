    return H/2 + Math.sin(ra-0.58)*H*0.29 + Math.sin(ra*2-0.14)*H*0.042;
  }

  // Draw band layers from widest to narrowest
  const layers=[
    {hw:H*0.28, col:'30,50,120',  a:0.4},
    {hw:H*0.18, col:'50,75,160',  a:0.5},
    {hw:H*0.10, col:'80,110,200', a:0.55},
    {hw:H*0.055,col:'120,150,230',a:0.6},
    {hw:H*0.025,col:'180,200,255',a:0.65},
  ];
  for(const L of layers){
    for(let x=0;x<W;x+=4){
      const cy=galY(x);
      const grd=tx.createLinearGradient(x,cy-L.hw,x,cy+L.hw);
      grd.addColorStop(0,'rgba(0,0,0,0)');
      grd.addColorStop(0.5,`rgba(${L.col},${L.a})`);
      grd.addColorStop(1,'rgba(0,0,0,0)');
      tx.fillStyle=grd;
      tx.fillRect(x,cy-L.hw,4,L.hw*2);
    }
  }

  // Galactic center (RA≈266°, Dec≈-29°) - warm orange/gold bulge glow
  const gcx=W*(266/360), gcy=galY(W*(266/360));
  const gcg=tx.createRadialGradient(gcx,gcy,0,gcx,gcy,H*0.18);
  gcg.addColorStop(0,'rgba(255,180,80,0.6)');
  gcg.addColorStop(0.4,'rgba(180,120,50,0.3)');
  gcg.addColorStop(1,'rgba(0,0,0,0)');
  tx.fillStyle=gcg; tx.fillRect(0,0,W,H);

  // Great Rift - dark lane
  tx.globalCompositeOperation='multiply';
  for(let x=0;x<W;x+=4){
    const cy=galY(x);
    const dg=tx.createLinearGradient(x,cy-H*0.025,x,cy+H*0.012);
    dg.addColorStop(0,'rgba(0,0,0,0)');
    dg.addColorStop(0.5,'rgba(0,0,0,0.7)');
    dg.addColorStop(1,'rgba(0,0,0,0)');
    tx.fillStyle=dg; tx.fillRect(x,cy-H*0.025,4,H*0.037);
  }
  tx.globalCompositeOperation='source-over';

  // Star dust in band
  for(let i=0;i<12000;i++){
    const x=Math.random()*W;
    const cy=galY(x);
    const dy=(Math.random()-0.5)*H*0.22;
    const falloff=Math.exp(-Math.abs(dy)/(H*0.06));
    if(Math.random()>falloff) continue;
    const b=Math.random()*0.8+0.2;
    const t=Math.random();
    const col=t<0.6?`rgba(200,215,255,${b})`
              :t<0.85?`rgba(255,245,210,${b})`
              :`rgba(255,170,90,${b*0.5})`;
    tx.fillStyle=col;
    tx.fillRect(x,cy+dy,1,1);
  }

  const tex=new THREE.CanvasTexture(tc);
  tex.minFilter=THREE.LinearFilter;
  tex.magFilter=THREE.LinearFilter;
  const geo=new THREE.SphereGeometry(493,64,32);
  const mat=new THREE.MeshBasicMaterial({
    map:tex, side:THREE.BackSide,
    transparent:true, opacity:0.92, depthWrite:false
  });
  scene.add(new THREE.Mesh(geo,mat));
  window._mwMat=mat;
})();

// 3. Round star sprite texture (radial gradient)
const starSprite=(function(){
  const s=64,tc=document.createElement('canvas');tc.width=s;tc.height=s;
  const tx=tc.getContext('2d');
  // Clear to transparent
  tx.clearRect(0,0,s,s);
  // Draw soft glowing circle
  const g=tx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.2,'rgba(220,235,255,0.9)');
  g.addColorStop(0.5,'rgba(180,210,255,0.5)');
  g.addColorStop(0.8,'rgba(140,180,255,0.15)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  tx.fillStyle=g;
  tx.fillRect(0,0,s,s);
  const tex=new THREE.CanvasTexture(tc);
  tex.premultiplyAlpha=false;
  return tex;
})();

// 4. Background stars — 12000, round sprites, 60% #c8d4ff, 25% #fff5e0, 15% #ffb870
let bgStarsMesh, brightStarsMesh, bloomStarsMesh;
(function(){
  const N=12000,R=490,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  const c1={r:200/255,g:215/255,b:1},c2={r:1,g:245/255,b:210/255},c3={r:1,g:170/255,b:90/255};
  for(let i=0;i<N;i++){
    const u=Math.random()*2*Math.PI,v=Math.acos(2*Math.random()-1);
    pos[i*3]=R*Math.sin(v)*Math.cos(u);pos[i*3+1]=R*Math.sin(v)*Math.sin(u);pos[i*3+2]=R*Math.cos(v);
    const t=Math.random();
    if(t<0.6){col[i*3]=c1.r;col[i*3+1]=c1.g;col[i*3+2]=c1.b;}
    else if(t<0.85){col[i*3]=c2.r;col[i*3+1]=c2.g;col[i*3+2]=c2.b;}
    else{col[i*3]=c3.r;col[i*3+1]=c3.g;col[i*3+2]=c3.b;}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:1.5,map:starSprite,transparent:true,opacity:0.9,vertexColors:true,sizeAttenuation:false,alphaTest:0.05,blending:THREE.AdditiveBlending,depthWrite:false});
  bgStarsMesh=new THREE.Points(g,mat);scene.add(bgStarsMesh);
})();

// 5. Bright named stars — size by magnitude (mag<0→5px, <1→4px, <2→3px, <3→2.5px), bloom halo opacity 0.15
(function(){
  const R=490;
  const allPos=[],allCol=[];
  STARS.forEach(s=>{
    const v=rd2v(s[1],s[2]).multiplyScalar(R);
    allPos.push(v.x,v.y,v.z);

// 6. Constellation lines — rgba(68,180,200,0.55), width 0.8
let lineObj,lineTotalSegments;
(function(){
  const pts=[],R=490;
  CONSTELLATIONS.forEach(c=>c.lines.forEach(seg=>{const v1=rd2v(seg[0],seg[1]).multiplyScalar(R),v2=rd2v(seg[2],seg[3]).multiplyScalar(R);pts.push(v1.x,v1.y,v1.z,v2.x,v2.y,v2.z);}));
  lineTotalSegments=pts.length/6;
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
  const lineMat=new THREE.LineBasicMaterial({color:0x44b4c8,transparent:true,opacity:0.55,linewidth:1});

// 7. Constellation fill — rgba(40,140,160,0.06), highlight 0.12
let fillObjs=[];
(function(){
  const R=488;
  CONSTELLATIONS.forEach(c=>{
    const pts=[];c.lines.forEach(seg=>{[0,2].forEach(off=>{const ra=seg[off],dec=seg[off+1];const key=ra.toFixed(2)+','+dec.toFixed(2);if(!pts.find(p=>p.k===key))pts.push({k:key,v:rd2v(ra,dec).multiplyScalar(R)});});});
    if(pts.length<3)return;
    const center=new THREE.Vector3();pts.forEach(p=>center.add(p.v));center.divideScalar(pts.length);
    const normal=center.clone().normalize(),up=new THREE.Vector3(0,1,0),tang=new THREE.Vector3().crossVectors(normal,up).normalize(),bitan=new THREE.Vector3().crossVectors(normal,tang).normalize();
    pts.sort((a,b)=>{const da=a.v.clone().sub(center),db=b.v.clone().sub(center);return Math.atan2(da.dot(bitan),da.dot(tang))-Math.atan2(db.dot(bitan),db.dot(tang));});
    const verts=[];for(let i=0;i<pts.length;i++){const next=(i+1)%pts.length;verts.push(center.x,center.y,center.z,pts[i].v.x,pts[i].v.y,pts[i].v.z,pts[next].v.x,pts[next].v.y,pts[next].v.z);}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
    const mat=new THREE.MeshBasicMaterial({color:0x288ca0,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false});
    const mesh=new THREE.Mesh(g,mat);scene.add(mesh);fillObjs.push({mesh,mat,name:c.name});
  });
})();

// 8. Camera — quaternion, momentum/inertia, zoom to cursor
let fov3=70,tFov3=70,drag=false,lx=0,ly=0,clickMoved=false;
let velX=0,velY=0;
const camQuat=new THREE.Quaternion(),tQuat=new THREE.Quaternion();
(function initCam(){
  // Point camera toward Orion at startup - dense star field
  const fwd=rd2v(83.8,5.0).normalize();
  const defaultDir=new THREE.Vector3(0,0,-1);
  // Set BOTH camQuat AND tQuat so camera starts immediately at correct angle
  camQuat.setFromUnitVectors(defaultDir,fwd);
  tQuat.copy(camQuat);
  // Apply to camera immediately - no slerp delay
  camera.quaternion.copy(camQuat);
})();

function rotateCam(dx,dy){const s=0.003*(fov3/70);const qH=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-dx*s);const right=new THREE.Vector3(1,0,0).applyQuaternion(tQuat);const qV=new THREE.Quaternion().setFromAxisAngle(right,dy*s);tQuat.premultiply(qH);tQuat.premultiply(qV);}
function lookAtRaDec(ra,dec,newFov){
  const fwd=rd2v(ra,dec).normalize();
  const defaultDir=new THREE.Vector3(0,0,-1);
  tQuat.setFromUnitVectors(defaultDir,fwd);
  if(newFov!=null)tFov3=newFov;
}
function getViewRaDec(){const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camQuat);const dec=Math.asin(Math.max(-1,Math.min(1,fwd.y)))*(180/Math.PI);const ra=(Math.atan2(fwd.z,-fwd.x)*(180/Math.PI)+360)%360;return[ra,dec];}

function zoomAtPoint(delta,px,py){
  const v=new THREE.Vector2((px/innerWidth)*2-1,-(py/innerHeight)*2+1);
  const raycaster=new THREE.Raycaster();raycaster.setFromCamera(v,camera);
  const dir=raycaster.ray.direction.clone().normalize();
  const centerDir=new THREE.Vector3(0,0,-1).applyQuaternion(camQuat);
  const axis=new THREE.Vector3().crossVectors(centerDir,dir).normalize();
  const angle=centerDir.angleTo(dir);
  const factor=delta>0?1.08:0.925;
  const newFov=Math.max(8,Math.min(100,tFov3*factor));
  const fovRatio=tFov3/newFov;
  const compAngle=angle*(1-1/fovRatio);
  if(axis.lengthSq()>0.0001){const q=new THREE.Quaternion().setFromAxisAngle(axis,compAngle);tQuat.premultiply(q);}
  tFov3=newFov;
}

cvs.addEventListener('mousedown',e=>{if(mode!=='3d')return;drag=true;lx=e.clientX;ly=e.clientY;velX=0;velY=0;clickMoved=false;cvs.classList.add('drag');});

  if(!drag||mode!=='3d')return;
  const dx=e.clientX-lx,dy=e.clientY-ly;

});

function camLook(){
  if(!drag&&(Math.abs(velX)>0.01||Math.abs(velY)>0.01)){rotateCam(velX,velY);velX*=0.88;velY*=0.88;}
  camQuat.slerp(tQuat,0.12);
  fov3+=(tFov3-fov3)*0.08;
  camera.fov=fov3;camera.updateProjectionMatrix();
  camera.quaternion.copy(camQuat);
  if(window._mwMat)window._mwMat.opacity=0.92;
  document.getElementById('fov-display').textContent='FOV '+Math.round(fov3)+'°';
}

  try{
    if(mode==='3d'){camLook();updateLabels3D();renderer.render(scene,camera);}
    else{updateLabelsAladin();document.getElementById('fov-display').textContent='FOV '+Math.round(aladin?aladin.getFov()[0]:60)+'°';}
  }catch(e){}
})();


window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  if(lineCanvas){lineCanvas.width=window.innerWidth;lineCanvas.height=window.innerHeight;}
});
</script>
</body>
</html>
