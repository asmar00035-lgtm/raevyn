<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no" />
    <title>Raevyn</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
      #aladin-lite-div {
        position: fixed; top: 0; left: 0;
        width: 100vw !important; height: 100vh !important;
      }
      #overlay {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #000; z-index: 10;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      .aladin-logo { display: none !important; }
    </style>
    <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
  </head>
  <body>
    <div id="aladin-lite-div"></div>
    <div id="overlay"></div>

    <script type="text/javascript">
      const overlay = document.getElementById('overlay');
      let hideTimer = null;

      function hideOverlay() {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => { overlay.style.opacity = '0'; }, 700);
      }
      function showOverlay() {
        clearTimeout(hideTimer);
        overlay.style.opacity = '0.95';
      }

      let aladin;
      A.init.then(() => {
        aladin = A.aladin('#aladin-lite-div', {
          survey:   'P/DSS2/color',
          fov:      180,        // يبدأ بعيد جداً — السماء كاملة
          target:   '0 0',
          cooFrame: 'ICRSd',
          showReticle: false,
          showZoomControl: false,
          showFullscreenControl: false,
          showLayersControl: false,
          showGotoControl: false,
          showSimbadPointerControl: false,
          showShareControl: false,
          showCooGrid: false,
          showFrame: false,
          showStatusBar: false,
        });

        // Hide overlay after initial tiles load
        setTimeout(hideOverlay, 2500);

        // Overlay on move
        const div = document.getElementById('aladin-lite-div');
        div.addEventListener('mousedown',  () => showOverlay());
        div.addEventListener('mouseup',    () => hideOverlay());
        div.addEventListener('mouseleave', () => hideOverlay());
        div.addEventListener('touchstart', () => showOverlay(), { passive: true });
        div.addEventListener('touchend',   () => hideOverlay(), { passive: true });
        div.addEventListener('wheel',      () => { showOverlay(); hideOverlay(); }, { passive: true });
      });
    </script>
  </body>
</html>
